name: OKF linkcheck tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Scan sample bundle
        run: |
          okf-linkcheck examples/bundle --format json --output /tmp/links.json
          python -c "import json; r=json.load(open('/tmp/links.json')); assert r['missing_links']==1 and r['unsafe_links']==0, r"
      - name: Export sample SARIF
        run: |
          okf-linkcheck examples/bundle --format sarif --output /tmp/links.sarif
          python -c "import json; r=json.load(open('/tmp/links.sarif')); assert r['version']=='2.1.0' and len(r['runs'][0]['results'])==1"
